<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PULSE Carousel Slide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0; /* Outer background to frame the 400x400 slide */
        }
    </style>
</head>
<body>

    <div style="position: relative; width: 400px; height: 400px; background-color: #060408; overflow: hidden; font-family: 'Josefin Sans', sans-serif; color: #ffffff; padding: 40px; box-sizing: border-box;">
        
        <div style="position: absolute; top: -120px; left: -100px; width: 350px; height: 350px; border-radius: 50%; background: radial-gradient(circle, #ff4d00 0%, #ff8c00 30%, #ffb347 55%, #e879f9 80%, transparent 100%); filter: blur(45px); z-index: 1;"></div>

        <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 2; opacity: 0.035; background-image: url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E'); pointer-events: none;"></div>

        <div style="position: relative; z-index: 3; display: flex; flex-direction: column; justify-content: center; height: 100%; padding-bottom: 20px;">
            <h1 style="font-size: 34px; font-weight: 700; line-height: 1.15; margin: 0 0 16px 0; letter-spacing: -0.5px;">
                Your data.<br>A story.<br>Every day.
            </h1>
            
            <p style="font-size: 15px; font-weight: 300; line-height: 1.4; margin: 0; max-width: 95%; opacity: 0.9;">
                Connect your platforms. Get daily insights. See your month as a story worth sharing.
            </p>
        </div>

        <div style="position: absolute; bottom: 35px; left: 40px; z-index: 3; font-family: monospace; font-size: 11px; letter-spacing: 2px; opacity: 0.25; text-transform: uppercase;">
            PULSE
        </div>

    </div>

</body>
</html>
